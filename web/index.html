<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maintenance Wizard - Command Center</title>
<style>
  :root {
    --bg:#f3f6f8; --panel:#ffffff; --panel2:#e7edf2; --line:#c7d2dc;
    --text:#17202a; --muted:#5b6978; --amber:#f59e0b; --red:#dc2626;
    --yellow:#eab308; --green:#0e9f6e; --purple:#7c3aed; --blue:#276ef1;
    --ink:#ffffff;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
    font:15px/1.5 system-ui, "Segoe UI", sans-serif; }
  header { position:sticky; top:0; z-index:10; background:rgba(255,255,255,.96);
    border-bottom:1px solid var(--line); backdrop-filter:blur(10px); box-shadow:0 8px 20px rgba(23,32,42,.08); }
  .top { max-width:1220px; margin:0 auto; padding:14px 18px 10px;
    display:flex; align-items:flex-start; justify-content:space-between; gap:16px; }
  h1 { margin:0; font-size:20px; letter-spacing:0; }
  .subtitle { color:var(--muted); font-size:13px; }
  .status { display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:flex-end; }
  nav { max-width:1220px; margin:0 auto; padding:0 18px 12px;
    display:flex; gap:8px; flex-wrap:wrap; }
  nav button, .btn, .chipbtn { min-height:42px; border:1px solid var(--line);
    background:var(--panel); color:var(--text); border-radius:6px; padding:8px 12px;
    font-weight:750; cursor:pointer; }
  nav button.active, .btn.primary { background:rgba(245,158,11,.16);
    border-color:var(--amber); color:var(--text); }
  .btn.primary { background:var(--amber); color:#111827; border:0; }
  .btn:disabled { opacity:.45; cursor:not-allowed; }
  main { max-width:1220px; margin:0 auto; padding:18px; }
  .grid { display:grid; gap:14px; }
  .kpis { grid-template-columns:repeat(5,minmax(0,1fr)); }
  .two { grid-template-columns:minmax(0,1.1fr) minmax(320px,.9fr); }
  .three { grid-template-columns:repeat(3,minmax(0,1fr)); }
  .cards { grid-template-columns:repeat(3,minmax(0,1fr)); }
  .panel, .asset, .msg, .block { background:var(--panel); border:1px solid var(--line);
    border-radius:8px; padding:14px; box-shadow:0 10px 24px rgba(23,32,42,.06); }
  .panel h2, .panel h3 { margin:0 0 10px; letter-spacing:0; }
  .kpi .num { font:850 30px/1.1 ui-monospace, Consolas, monospace; }
  .kpi .label { color:var(--muted); font-size:12px; font-weight:800; text-transform:uppercase; }
  .asset { cursor:pointer; min-height:168px; }
  .asset:hover { border-color:var(--amber); }
  .asset.critical { border:2px solid var(--red); box-shadow:0 0 22px rgba(255,77,79,.12); }
  .asset.top { grid-column:1 / -1; min-height:150px; display:grid; grid-template-columns:1fr 1.8fr 1.15fr; gap:18px; align-items:center; }
  .row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .space { justify-content:space-between; }
  .mono { font-family:ui-monospace, Consolas, monospace; font-variant-numeric:tabular-nums; }
  .chip { display:inline-flex; align-items:center; justify-content:center; min-height:26px;
    border-radius:5px; padding:4px 8px; font-size:12px; font-weight:850;
    color:var(--ink); text-transform:uppercase; white-space:nowrap; }
  .critical-chip { background:var(--red); color:#fff; }
  .high-chip { background:var(--amber); color:#111827; }
  .medium-chip { background:var(--yellow); color:#111827; }
  .low-chip { background:var(--green); color:#fff; }
  .normal-chip { background:#dbe4ec; color:#344254; }
  .constraint-chip { background:var(--purple); color:#fff; }
  .muted { color:var(--muted); }
  .danger { color:var(--red); }
  .good { color:var(--green); }
  .hide { display:none !important; }
  .scenario { border-left:4px solid var(--amber); }
  .metricbar { height:10px; border-radius:999px; background:#d7e0e8; overflow:hidden; }
  .metricbar span { display:block; height:100%; background:linear-gradient(90deg,var(--amber),#fff3); }
  .metricbar.purple span { background:linear-gradient(90deg,var(--purple),#fff3); }
  .driver { display:grid; grid-template-columns:110px 1fr 58px; gap:8px; align-items:center; margin:8px 0; }
  .chatlog { max-height:520px; overflow:auto; display:flex; flex-direction:column; gap:10px; }
  .msg.user { background:#dceafe; border-color:#9dbaf8; margin-left:12%; white-space:pre-wrap; }
  .msg.bot { margin-right:4%; }
  .msg h3 { color:var(--amber); margin:14px 0 4px; font-size:15px; }
  .msg blockquote { border-left:3px solid var(--amber); margin:8px 0; padding-left:10px; color:var(--muted); }
  .sources { border-top:1px dashed var(--line); margin-top:10px; padding-top:8px; color:var(--muted); font-size:13px; }
  form { display:flex; gap:8px; margin-top:12px; }
  input, textarea, select { width:100%; background:#ffffff; color:var(--text);
    border:1px solid var(--line); border-radius:7px; padding:10px; font:inherit; }
  input:focus, textarea:focus, select:focus, button:focus-visible {
    outline:3px solid rgba(255,159,28,.75); outline-offset:2px;
  }
  .check { display:flex; align-items:center; gap:10px; min-height:44px; }
  .check input { width:22px; height:22px; }
  .table { width:100%; border-collapse:collapse; }
  .table th, .table td { border-bottom:1px solid var(--line); padding:8px; text-align:left; }
  .table th { color:var(--muted); font-size:12px; text-transform:uppercase; }
  footer { max-width:1220px; margin:10px auto 28px; padding:0 18px; color:var(--muted); font-size:12px; }
  @media (max-width:900px) {
    .kpis, .two, .three, .cards { grid-template-columns:1fr; }
    .asset.top { grid-column:auto; grid-template-columns:1fr; }
    .top { flex-direction:column; }
    .status { justify-content:flex-start; }
    nav button { flex:1 1 160px; }
    .driver { grid-template-columns:1fr; }
  }
</style>
</head>
<body>
<header>
  <div class="top">
    <div>
      <h1>Maintenance Wizard Command Center</h1>
      <div class="subtitle">Agentic decision-support for a synthetic heavy steel plant</div>
    </div>
    <div class="status">
      <span class="chip normal-chip">Dashboard deterministic</span>
      <span class="chip high-chip">Chat Gemini + fallback</span>
      <span id="dataStamp" class="muted mono">loading...</span>
    </div>
  </div>
  <nav id="tabs">
    <button data-tab="command" class="active">Command Center</button>
    <button data-tab="deep">Asset Deep-Dive</button>
    <button data-tab="chat">Wizard Chat</button>
    <button data-tab="shift">Pre-Shift</button>
    <button data-tab="logbook">Logbook</button>
  </nav>
</header>

<main>
  <section id="command" class="view"></section>
  <section id="deep" class="view hide"></section>
  <section id="chat" class="view hide"></section>
  <section id="shift" class="view hide"></section>
  <section id="logbook" class="view hide"></section>
</main>
<footer>Synthetic data · hosted writes are dry-run/session-only · outputs are decision support requiring engineer sign-off.</footer>

<script>
const state = { data:null, selected:"GEARBOX-05", chatHistory:[], logEntries:[],
  checks:{parts_recorded:false, steps_logged:false, isolation_cleared:false, follow_up_scheduled:false, digital_logbook_entry:false} };

const $ = id => document.getElementById(id);
const money = v => "$" + Number(v || 0).toLocaleString(undefined, {maximumFractionDigits:0});
const fmt = v => Number(v || 0).toLocaleString(undefined, {maximumFractionDigits:0});
const esc = s => String(s ?? "").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const jsarg = s => JSON.stringify(String(s ?? "")).replace(/"/g, "&quot;");

function bandChip(band) {
  const b = String(band || "LOW").toLowerCase();
  return `<span class="chip ${b}-chip">${esc(band || "LOW")}</span>`;
}
function anomalyChip(status) {
  const s = String(status || "NORMAL").toUpperCase();
  return `<span class="chip ${s === "CRITICAL" ? "critical-chip" : s === "WARNING" ? "high-chip" : "normal-chip"}">⚡ ${esc(s)}</span>`;
}
function constraintChip(flag) {
  return flag ? `<span class="chip constraint-chip">⛔ Part cannot arrive in time</span>` : "";
}
function assetById(id) { return state.data.assets.find(a => a.asset_id === id) || state.data.assets[0]; }
function selectAsset(id, tab="deep") { state.selected = id; renderAll(); showTab(tab); }

function renderKpis() {
  const k = state.data.kpis;
  return `<div class="grid kpis">
    <div class="panel kpi"><div class="num">${state.data.asset_count}</div><div class="label">Assets monitored</div></div>
    <div class="panel kpi"><div class="num danger">${k.critical}</div><div class="label">Critical</div></div>
    <div class="panel kpi"><div class="num">${k.abnormal}</div><div class="label">Abnormal</div></div>
    <div class="panel kpi"><div class="num">${k.constraint_flagged}</div><div class="label">Constraint flagged</div></div>
    <div class="panel kpi"><div class="num">${money(k.value_at_risk_usd)}</div><div class="label">30d value at risk</div></div>
  </div>`;
}

function renderAssetCard(a, top=false) {
  const risk = a.risk || {}, prog = a.prognostic || {}, abn = a.abnormality || {};
  if (top) {
    return `<div class="asset ${risk.priority_band === "CRITICAL" ? "critical" : ""} top" onclick="selectAsset('${a.asset_id}')">
      <div>
        <div class="row">${bandChip(risk.priority_band)} ${anomalyChip(abn.status)}</div>
        <div class="mono" style="font-size:34px;font-weight:950;margin-top:14px">${risk.priority_score}/100</div>
        <div class="muted" style="font-weight:800;text-transform:uppercase">priority score</div>
      </div>
      <div>
        <h3 style="font-size:24px;margin:0 0 8px">${esc(a.asset_id)} · ${esc(a.name)}</h3>
        <div class="muted">${esc(a.type)} · ${esc(a.line)} · criticality ${esc(a.criticality)}</div>
        <div style="margin-top:12px">${constraintChip(risk.constraint_flag)}</div>
      </div>
      <div class="panel" style="background:var(--panel2);box-shadow:none">
        <div class="row space"><span class="muted">RUL</span><b class="mono">${esc(prog.rul_days)}d</b></div>
        <div class="row space"><span class="muted">Fail 30d</span><b class="mono">${Math.round((prog.failure_probability_30d || 0)*100)}%</b></div>
        <div class="row space"><span class="muted">Value at risk</span><b class="mono">${money(risk.averted_usd)}</b></div>
      </div>
    </div>`;
  }
  return `<div class="asset ${risk.priority_band === "CRITICAL" ? "critical" : ""} ${top ? "top" : ""}" onclick="selectAsset('${a.asset_id}')">
    <div class="row space"><div class="row">${bandChip(risk.priority_band)} ${anomalyChip(abn.status)}</div><div class="mono" style="font-size:24px;font-weight:900">${risk.priority_score}/100</div></div>
    <h3>${esc(a.asset_id)} · ${esc(a.name)}</h3>
    <div class="muted">${esc(a.type)} · ${esc(a.line)} · criticality ${esc(a.criticality)}</div>
    <div class="row" style="margin-top:10px"><span class="mono">RUL ${esc(prog.rul_days)}d</span><span class="mono">Fail 30d ${Math.round((prog.failure_probability_30d || 0)*100)}%</span><span class="mono">${money(risk.averted_usd)} risk</span></div>
    <div style="margin-top:10px">${constraintChip(risk.constraint_flag)}</div>
  </div>`;
}

function renderCommand() {
  const topAssets = state.data.assets.slice(0, 7);
  $("command").innerHTML = `
    ${renderKpis()}
    <div class="grid two" style="margin-top:14px">
      <div class="panel">
        <div class="row space"><h2>Plant bottleneck board</h2><button class="btn primary" onclick="selectAsset('GEARBOX-05')">Open GEARBOX-05</button></div>
        <div class="grid cards" style="margin-top:12px">
          ${topAssets.map((a,i) => renderAssetCard(a, i===0)).join("")}
        </div>
      </div>
      <div class="grid">
        <div class="panel scenario">
          <h2>The signature flip</h2>
          <p><b>GEARBOX-05</b> is critical because the limiting part lead time exceeds predicted RUL. The hosted dashboard proves this without an LLM call.</p>
          <p>${constraintChip(state.data.signature_story.risk.constraint_flag)}</p>
          <button class="btn primary" onclick="selectAsset('GEARBOX-05','deep')">Inspect evidence</button>
          <button class="btn" onclick="askScenario('What\\'s wrong with the mill gearbox?')">Run chat demo</button>
        </div>
        <div class="panel">
          <h3>Demo scenarios</h3>
          ${state.data.scenarios.map(s => `<button class="chipbtn" style="width:100%;margin:5px 0;text-align:left" onclick="selectAsset('${s.asset_id}','deep')"><b>${esc(s.title)}</b><br><span class="muted">${esc(s.why)}</span></button>`).join("")}
        </div>
      </div>
    </div>`;
}

function renderDeep() {
  const a = assetById(state.selected), risk=a.risk||{}, prog=a.prognostic||{}, abn=a.abnormality||{};
  const parts = (a.inventory && a.inventory.parts) || [];
  const drivers = Object.entries((prog.shap && prog.shap.contributions) || {}).sort((x,y)=>Math.abs(y[1])-Math.abs(x[1]));
  const maxDriver = Math.max(1, ...drivers.map(d=>Math.abs(d[1])));
  $("deep").innerHTML = `
    <div class="panel">
      <div class="row space">
        <div><h2>${esc(a.asset_id)} · ${esc(a.name)}</h2><div class="muted">${esc(a.type)} · ${esc(a.line)}</div></div>
        <div class="row">${bandChip(risk.priority_band)} ${anomalyChip(abn.status)} ${constraintChip(risk.constraint_flag)}</div>
      </div>
      <div class="grid kpis" style="margin-top:14px">
        <div class="panel kpi"><div class="num">${risk.priority_score}/100</div><div class="label">Priority</div></div>
        <div class="panel kpi"><div class="num">${prog.rul_days}d</div><div class="label">RUL</div></div>
        <div class="panel kpi"><div class="num">${Math.round((prog.failure_probability_30d||0)*100)}%</div><div class="label">Failure 30d</div></div>
        <div class="panel kpi"><div class="num">${money(risk.averted_usd)}</div><div class="label">Value at risk</div></div>
        <div class="panel kpi"><div class="num">${money(risk.emv)}</div><div class="label">Positive EMV</div></div>
      </div>
    </div>
    <div class="grid two" style="margin-top:14px">
      <div class="panel"><h3>SHAP / abnormality evidence</h3>
        <p class="muted">Attribution method: ${esc(prog.shap && prog.shap.method)}</p>
        ${drivers.map(([name,val]) => `<div class="driver"><b>${esc(name)}</b><div class="metricbar"><span style="width:${Math.min(100,Math.abs(val)/maxDriver*100)}%"></span></div><span class="mono">${Number(val).toFixed(1)}d</span></div>`).join("")}
        <p>${esc(abn.recommendation || "")}</p>
      </div>
      <div class="panel"><h3>Parts lead time vs RUL</h3>
        ${parts.map(p => `<div class="panel" style="margin:8px 0;background:var(--panel2)">
          <div class="row space"><b class="mono">${esc(p.part_no)}</b><span class="chip ${p.qty_on_hand > 0 ? "low-chip" : "critical-chip"}">${p.qty_on_hand > 0 ? "IN STOCK · "+p.qty_on_hand : "OUT OF STOCK"}</span></div>
          <div class="muted">${esc(p.description)}</div>
          <div class="row" style="margin-top:8px"><span class="mono">lead ${p.lead_time_days}d</span><span class="mono">RUL ${prog.rul_days}d</span><span class="mono">${money(p.unit_cost_usd)}</span></div>
          <div class="metricbar purple" style="margin-top:8px"><span style="width:${Math.min(100, p.lead_time_days / Math.max(p.lead_time_days, prog.rul_days, 1) * 100)}%"></span></div>
        </div>`).join("")}
      </div>
      <div class="panel"><h3>Retrieved SOP / incident sources</h3>
        ${(a.evidence || []).map(h => `<div class="panel" style="margin:8px 0;background:var(--panel2)"><b>${esc(h.source)}</b><p class="muted">${esc(String(h.text || "").slice(0,220))}...</p></div>`).join("") || "<p class='muted'>No evidence returned.</p>"}
      </div>
      <div class="panel"><h3>Delay and incident history</h3>
        <p>${a.delay_summary.events} delay events · ${a.delay_summary.total_downtime_min} min downtime · ${fmt(a.delay_summary.tonnage_lost)} t lost</p>
        ${(a.incidents || []).map(i => `<p><b>${esc(i.incident_id || i.date)}</b> ${esc(i.title || i.root_cause || "")}</p>`).join("") || "<p class='muted'>No prior incidents on record.</p>"}
        <button class="btn primary" onclick="askScenario('What\\'s wrong with ${a.asset_id}?')">Ask Wizard about this asset</button>
      </div>
    </div>`;
}

function renderMd(text) {
  return esc(text).replace(/^```.*$/gm,"").replace(/^### (.+)$/gm,"<h3>$1</h3>")
    .replace(/^&gt; (.+)$/gm,"<blockquote>$1</blockquote>")
    .replace(/\*\*([^*\n]+)\*\*/g,"<b>$1</b>").replace(/`([^`\n]+)`/g,"<code>$1</code>").replace(/\n/g,"<br>");
}
function addChat(cls, text, sources, fallbackNote) {
  const box = document.createElement("div"); box.className = "msg " + cls;
  box.innerHTML = cls === "bot" ? renderMd(text) : esc(text);
  if (fallbackNote) box.innerHTML = `<div class="chip high-chip">Hosted demo fallback</div><p class="muted">${esc(fallbackNote)}</p>` + box.innerHTML;
  if (sources && sources.length) box.innerHTML += `<div class="sources"><b>Retrieved sources:</b> ${sources.map(s=>esc(s.source)).filter((v,i,a)=>a.indexOf(v)===i).join(" · ")}</div>`;
  $("chatlog").appendChild(box); $("chatlog").scrollTop = $("chatlog").scrollHeight;
}
async function ask(text) {
  addChat("user", text);
  $("q").value = ""; $("send").disabled = true;
  const pending = document.createElement("div"); pending.className = "msg bot"; pending.textContent = "Thinking and running tools..."; $("chatlog").appendChild(pending);
  try {
    const res = await fetch("/api/chat", {method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify({message:text, history:state.chatHistory})});
    const data = await res.json(); if (!res.ok) throw new Error(data.error || res.statusText);
    state.chatHistory = data.history || [];
    pending.remove(); addChat("bot", data.text, data.sources, data.fallback_note);
  } catch (err) {
    pending.textContent = "Error: " + err.message;
  } finally { $("send").disabled = false; $("q").focus(); }
}
function askScenario(text) { showTab("chat"); setTimeout(()=>ask(text), 50); }
function renderChat() {
  $("chat").innerHTML = `<div class="grid two">
    <div class="panel"><h2>Wizard Chat</h2><p class="muted">Live Gemini tool-use when available; GEARBOX-05 has deterministic hosted fallback.</p>
      <div class="row">${state.data.scenarios.map(s=>`<button class="chipbtn" onclick="askScenario(${jsarg(s.prompt)})">${esc(s.prompt)}</button>`).join("")}</div>
      <div id="chatlog" class="chatlog" style="margin-top:12px"></div>
      <form id="chatForm"><input id="q" autocomplete="off" placeholder="Ask about any asset - ID or plant jargon"><button id="send" class="btn primary">Send</button></form>
    </div>
    <div class="panel"><h3>Trust contract</h3><p>Every answer should preserve the five-block structure: risk, diagnosis, maintenance blueprint, logistics, traceability.</p><p>Tool outputs are the only source of truth; hosted fallback is labelled when used.</p></div>
  </div>`;
  $("chatForm").addEventListener("submit", e => { e.preventDefault(); const t=$("q").value.trim(); if(t) ask(t); });
}

function renderShift() {
  const rows = state.data.pre_shift.assets;
  $("shift").innerHTML = `<div class="panel"><h2>Pre-shift autonomous briefing</h2>
    <p><b>${state.data.pre_shift.needs_attention}</b> assets need attention (${state.data.pre_shift.critical} critical, ${state.data.pre_shift.abnormal} abnormal, ${state.data.pre_shift.constraint_flagged} constrained).</p>
    <table class="table"><thead><tr><th>Asset</th><th>Band</th><th>RUL</th><th>Value at risk</th><th>Action</th></tr></thead><tbody>
      ${rows.map(r=>`<tr><td>${esc(r.asset_id)}</td><td>${bandChip(r.priority_band)}</td><td>${esc(r.rul_days)}d</td><td>${money(r.value_at_risk_usd)}</td><td>${r.constraint_flag ? "Procurement + monitored degradation" : "Inspect / repair per SOP"}</td></tr>`).join("")}
    </tbody></table></div>`;
}

function renderLogbook() {
  const a = assetById(state.selected);
  const labels = {parts_recorded:"Parts used recorded", steps_logged:"Repair steps logged", isolation_cleared:"Safety isolation cleared", follow_up_scheduled:"Follow-up inspection scheduled", digital_logbook_entry:"Logbook entry written"};
  const missing = Object.keys(labels).filter(k => !state.checks[k]);
  $("logbook").innerHTML = `<div class="grid two">
    <div class="panel"><h2>Digital logbook dry-run</h2><p class="muted">Hosted demo stores this only in your browser session.</p>
      <label>Asset</label><select id="logAsset">${state.data.assets.map(x=>`<option ${x.asset_id===a.asset_id?"selected":""}>${x.asset_id}</option>`).join("")}</select>
      <label>Work order</label><input id="wo" value="WO-${a.asset_id}-DEMO">
      ${Object.entries(labels).map(([k,l])=>`<label class="check"><input type="checkbox" data-check="${k}" ${state.checks[k]?"checked":""}> ${l}</label>`).join("")}
      <textarea id="note" rows="4" placeholder="Engineer note"></textarea>
      <p class="${missing.length ? "danger" : "good"}">${missing.length ? "Closure blocked: " + missing.join(", ") : "All compliance items green - dry-run closure allowed."}</p>
      <button class="btn primary" ${missing.length ? "disabled" : ""} onclick="closeJob()">Close & log dry-run</button>
    </div>
    <div class="panel"><h3>Session log</h3>${state.logEntries.map(e=>`<div class="panel" style="margin:8px 0;background:var(--panel2)"><b>${esc(e.wo)}</b><br>${esc(e.asset)} · ${esc(e.note)}</div>`).join("") || "<p class='muted'>No dry-run entries yet.</p>"}</div>
  </div>`;
  $("logAsset").addEventListener("change", e => { state.selected=e.target.value; renderAll(); });
  document.querySelectorAll("[data-check]").forEach(el => el.addEventListener("change", e => { state.checks[e.target.dataset.check]=e.target.checked; renderLogbook(); }));
}
function closeJob(){ state.logEntries.unshift({wo:$("wo").value, asset:state.selected, note:$("note").value || "Hosted demo dry-run closure"}); state.checks={parts_recorded:false, steps_logged:false, isolation_cleared:false, follow_up_scheduled:false, digital_logbook_entry:false}; renderLogbook(); }

function renderAll(){ renderCommand(); renderDeep(); renderShift(); renderLogbook(); if(!$("chatlog")) renderChat(); }
function showTab(tab) {
  document.querySelectorAll(".view").forEach(v => v.classList.toggle("hide", v.id !== tab));
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
}
document.querySelectorAll("nav button").forEach(b => b.addEventListener("click", () => { if(b.dataset.tab==="chat" && !$("chatlog")) renderChat(); showTab(b.dataset.tab); }));

async function init() {
  try {
    const res = await fetch("/api/dashboard");
    const data = await res.json(); if (!res.ok) throw new Error(data.error || res.statusText);
    state.data = data; $("dataStamp").textContent = "data " + (data.generated || "bundled");
    renderChat(); renderAll(); showTab("command");
  } catch (err) {
    $("command").innerHTML = `<div class="panel"><h2>Dashboard unavailable</h2><p class="danger">${esc(err.message)}</p><p>The chat endpoint may still be available.</p></div>`;
    renderChat(); showTab("command");
  }
}
init();
</script>
</body>
</html>
