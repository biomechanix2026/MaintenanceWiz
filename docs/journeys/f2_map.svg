<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif">
  <title>F2 · Arjun — the wrench doesn't stop for paperwork (ROADMAP)</title>
  <text x="16" y="26" font-size="16" font-weight="bold" fill="#1F2937">F2 · Arjun — the wrench doesn't stop for paperwork (ROADMAP)</text>
  <rect x="1080" y="8" width="104" height="24" rx="12" fill="#D97706"/>
  <text x="1132" y="24" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">ROADMAP</text>
  <line x1="60" y1="160" x2="1140" y2="160" stroke="#D97706" stroke-width="2" stroke-dasharray="6 3"/>
  <g>
    <circle cx="160" cy="160" r="6" fill="#D97706"/>
    <rect x="70" y="54" width="180" height="84" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-dasharray="6 3"/>
    <text x="160" y="78" font-size="10" fill="#1F2937" text-anchor="middle">Coupling lets go;</text>
    <text x="160" y="94" font-size="10" fill="#1F2937" text-anchor="middle">he scans the QR</text>
    <rect x="70" y="190" width="180" height="58" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-dasharray="6 3"/>
    <text x="160" y="212" font-size="10" fill="#1F2937" text-anchor="middle">deep link → asset</text>
    <text x="160" y="228" font-size="10" fill="#1F2937" text-anchor="middle">deep-dive on phone</text>
  </g>
  <g>
    <circle cx="380" cy="160" r="6" fill="#D97706"/>
    <rect x="290" y="54" width="180" height="84" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-dasharray="6 3"/>
    <text x="380" y="78" font-size="10" fill="#1F2937" text-anchor="middle">Reads the SOP checklist,</text>
    <text x="380" y="94" font-size="10" fill="#1F2937" text-anchor="middle">gloves on</text>
    <rect x="290" y="190" width="180" height="58" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-dasharray="6 3"/>
    <text x="380" y="212" font-size="10" fill="#1F2937" text-anchor="middle">asset-filtered retrieval</text>
    <text x="380" y="228" font-size="10" fill="#1F2937" text-anchor="middle">48px targets</text>
  </g>
  <g>
    <circle cx="600" cy="160" r="8" fill="#D97706"/>
    <rect x="500" y="46" width="200" height="94" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="2" stroke-dasharray="6 3"/>
    <text x="600" y="72" font-size="10" font-weight="bold" fill="#1F2937" text-anchor="middle">★ Says what he sees;</text>
    <text x="600" y="88" font-size="10" font-weight="bold" fill="#1F2937" text-anchor="middle">snaps two photos</text>
    <rect x="500" y="190" width="200" height="58" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-dasharray="6 3"/>
    <text x="600" y="212" font-size="10" fill="#1F2937" text-anchor="middle">voice note + photo evidence</text>
    <text x="600" y="228" font-size="10" fill="#1F2937" text-anchor="middle">structured breakdown record</text>
  </g>
  <g>
    <circle cx="820" cy="160" r="6" fill="#D97706"/>
    <rect x="730" y="54" width="180" height="84" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-dasharray="6 3"/>
    <text x="820" y="78" font-size="10" fill="#1F2937" text-anchor="middle">Ticks isolation steps</text>
    <text x="820" y="94" font-size="10" fill="#1F2937" text-anchor="middle">as he works</text>
    <rect x="730" y="190" width="180" height="58" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-dasharray="6 3"/>
    <text x="820" y="212" font-size="10" fill="#1F2937" text-anchor="middle">checklist state carries</text>
    <text x="820" y="228" font-size="10" fill="#1F2937" text-anchor="middle">into closure</text>
  </g>
  <g>
    <circle cx="1040" cy="160" r="6" fill="#D97706"/>
    <rect x="950" y="54" width="180" height="84" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-dasharray="6 3"/>
    <text x="1040" y="78" font-size="10" fill="#1F2937" text-anchor="middle">End of shift:</text>
    <text x="1040" y="94" font-size="10" fill="#1F2937" text-anchor="middle">one signoff, zero retyping</text>
    <rect x="950" y="190" width="180" height="58" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-dasharray="6 3"/>
    <text x="1040" y="212" font-size="10" fill="#1F2937" text-anchor="middle">identity + signoff;</text>
    <text x="1040" y="228" font-size="10" fill="#1F2937" text-anchor="middle">logbook written for him</text>
  </g>
</svg>
