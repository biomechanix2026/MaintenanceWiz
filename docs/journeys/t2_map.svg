<svg viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif">
  <text x="16" y="26" font-size="16" font-weight="bold" fill="#1F2937">T2 &#xB7; Meera, shift supervisor &#x2014; the shift that starts itself</text>
  <rect x="1038" y="8" width="150" height="24" rx="12" fill="#EAF2FB" stroke="#9CC0E6"/>
  <text x="1113" y="24" font-size="11" fill="#1F2937" text-anchor="middle">surface: cron + wallboard</text>
  <line x1="40" y1="160" x2="1160" y2="160" stroke="#94A3B8" stroke-width="2"/>

  <!-- Step 1 (highlight) -->
  <g>
    <circle cx="160" cy="160" r="8" fill="#B388FF"/>
    <rect x="70" y="60" width="180" height="72" rx="8" fill="#F3E8FF" stroke="#B388FF" stroke-width="2"/>
    <text x="160" y="82" font-size="11" fill="#1F2937" text-anchor="middle">05:45 &#x2014; nobody is logged in.</text>
    <text x="160" y="98" font-size="11" fill="#1F2937" text-anchor="middle">The scan runs itself.</text>
    <text x="160" y="118" font-size="10" fill="#6B21A8" text-anchor="middle">the &#x201C;Systems of Action&#x201D; moment</text>
    <rect x="70" y="190" width="180" height="56" rx="8" fill="#F3E8FF" stroke="#B388FF"/>
    <text x="160" y="212" font-size="10" fill="#1F2937" text-anchor="middle">pre_shift_run scores</text>
    <text x="160" y="228" font-size="10" fill="#1F2937" text-anchor="middle">all 12 assets</text>
  </g>

  <!-- Step 2 -->
  <g>
    <circle cx="380" cy="160" r="6" fill="#2563EB"/>
    <rect x="290" y="60" width="180" height="72" rx="8" fill="#F8FAFC" stroke="#94A3B8"/>
    <text x="380" y="82" font-size="11" fill="#1F2937" text-anchor="middle">Alerts are already</text>
    <text x="380" y="98" font-size="11" fill="#1F2937" text-anchor="middle">routed by role</text>
    <rect x="290" y="190" width="180" height="56" rx="8" fill="#EAF2FB" stroke="#9CC0E6"/>
    <text x="380" y="208" font-size="10" fill="#1F2937" text-anchor="middle">alert_dispatch_tool &#x2192; supervisor</text>
    <text x="380" y="224" font-size="10" fill="#1F2937" text-anchor="middle">/ reliability / maintenance,</text>
    <text x="380" y="237" font-size="10" fill="#1F2937" text-anchor="middle">deduped</text>
  </g>

  <!-- Step 3 -->
  <g>
    <circle cx="600" cy="160" r="6" fill="#2563EB"/>
    <rect x="510" y="60" width="180" height="72" rx="8" fill="#F8FAFC" stroke="#94A3B8"/>
    <text x="600" y="82" font-size="11" fill="#1F2937" text-anchor="middle">She reads the briefing:</text>
    <text x="600" y="98" font-size="11" fill="#1F2937" text-anchor="middle">counts, top risks,</text>
    <text x="600" y="114" font-size="11" fill="#1F2937" text-anchor="middle">drafted WOs</text>
    <rect x="510" y="190" width="180" height="56" rx="8" fill="#EAF2FB" stroke="#9CC0E6"/>
    <text x="600" y="212" font-size="10" fill="#1F2937" text-anchor="middle">reports/preshift_*.md</text>
  </g>

  <!-- Step 4 -->
  <g>
    <circle cx="820" cy="160" r="6" fill="#2563EB"/>
    <rect x="730" y="60" width="180" height="72" rx="8" fill="#F8FAFC" stroke="#94A3B8"/>
    <text x="820" y="82" font-size="11" fill="#1F2937" text-anchor="middle">Glances at the wallboard</text>
    <text x="820" y="98" font-size="11" fill="#1F2937" text-anchor="middle">across the room</text>
    <rect x="730" y="190" width="180" height="56" rx="8" fill="#EAF2FB" stroke="#9CC0E6"/>
    <text x="820" y="208" font-size="10" fill="#1F2937" text-anchor="middle">?wallboard=1 &#x2014; top cards,</text>
    <text x="820" y="224" font-size="10" fill="#1F2937" text-anchor="middle">auto-refresh</text>
  </g>

  <!-- Step 5 -->
  <g>
    <circle cx="1040" cy="160" r="6" fill="#2563EB"/>
    <rect x="950" y="60" width="180" height="72" rx="8" fill="#F8FAFC" stroke="#94A3B8"/>
    <text x="1040" y="82" font-size="11" fill="#1F2937" text-anchor="middle">Handover takes minutes,</text>
    <text x="1040" y="98" font-size="11" fill="#1F2937" text-anchor="middle">not war stories</text>
    <rect x="950" y="190" width="180" height="56" rx="8" fill="#EAF2FB" stroke="#9CC0E6"/>
    <text x="1040" y="208" font-size="10" fill="#1F2937" text-anchor="middle">every claim traceable</text>
    <text x="1040" y="224" font-size="10" fill="#1F2937" text-anchor="middle">to the report</text>
  </g>
</svg>
