<svg width="1200" height="360" viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif">
  <title>F1 roadmap storyboard</title>
  <text x="24" y="32" font-size="18" font-weight="bold" fill="#1F2937">F1 storyboard — one inbox for the plant</text>
  <g transform="translate(40,60)">
    <rect width="340" height="260" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-dasharray="6 3"/>
    <rect x="226" y="14" width="90" height="22" rx="11" fill="#D97706"/><text x="271" y="29" font-size="10" fill="#fff" text-anchor="middle">ROADMAP</text>
    <rect x="28" y="54" width="260" height="54" rx="12" fill="#fff" stroke="#D97706" stroke-dasharray="6 3"/>
    <text x="42" y="76" font-size="12" fill="#1F2937">log a 40-min breakdown on</text>
    <text x="42" y="94" font-size="12" fill="#1F2937">belt 3, bearing noise</text>
    <rect x="52" y="132" width="260" height="78" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-dasharray="6 3"/>
    <text x="66" y="154" font-size="12" fill="#1F2937">Filed: DLY-#### · CONV-BELT-03</text>
    <text x="66" y="172" font-size="12" fill="#1F2937">MECH · 40 min. Link order</text>
    <text x="66" y="190" font-size="12" fill="#1F2937">4501234? [yes/no]</text>
  </g>
  <g transform="translate(430,60)">
    <rect width="340" height="260" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-dasharray="6 3"/>
    <rect x="226" y="14" width="90" height="22" rx="11" fill="#D97706"/><text x="271" y="29" font-size="10" fill="#fff" text-anchor="middle">ROADMAP</text>
    <text x="32" y="64" font-size="13" font-weight="bold" fill="#1F2937">Daily task signoff</text>
    <rect x="32" y="88" width="276" height="32" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-dasharray="6 3"/>
    <text x="48" y="109" font-size="12" fill="#1F2937">✓ Expedite PINION-G5</text>
    <rect x="32" y="132" width="276" height="32" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-dasharray="6 3"/>
    <text x="48" y="153" font-size="12" fill="#1F2937">✓ Assign gearbox inspection</text>
    <rect x="76" y="198" width="188" height="34" rx="8" fill="#D97706"/>
    <text x="170" y="220" font-size="13" fill="#fff" text-anchor="middle">Sign off as Shalini</text>
  </g>
  <g transform="translate(820,60)">
    <rect width="340" height="260" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-dasharray="6 3"/>
    <rect x="226" y="14" width="90" height="22" rx="11" fill="#D97706"/><text x="271" y="29" font-size="10" fill="#fff" text-anchor="middle">ROADMAP</text>
    <rect x="44" y="76" width="70" height="90" rx="6" fill="#fff" stroke="#D97706" stroke-dasharray="6 3"/>
    <text x="79" y="126" font-size="28" fill="#D97706" text-anchor="middle">W</text>
    <line x1="126" y1="122" x2="214" y2="122" stroke="#D97706" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="226" y="76" width="70" height="90" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-dasharray="6 3"/>
    <text x="261" y="126" font-size="24" fill="#D97706" text-anchor="middle">DB</text>
    <text x="54" y="206" font-size="12" fill="#1F2937">23 historical breakdowns ingested</text>
    <text x="86" y="224" font-size="12" fill="#1F2937">→ searchable</text>
  </g>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#D97706"/></marker>
  </defs>
</svg>
