<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif">
  <title>T4 · Shalini, maintenance manager — where is tomorrow's downtime coming from?</title>
  <text x="16" y="26" font-size="16" font-weight="bold" fill="#1F2937">T4 · Shalini, maintenance manager — "where is tomorrow's downtime coming from?"</text>
  <rect x="1030" y="8" width="154" height="24" rx="12" fill="#EAF2FB" stroke="#9CC0E6"/>
  <text x="1107" y="24" font-size="11" fill="#1F2937" text-anchor="middle">surface: Bottleneck board</text>
  <line x1="60" y1="160" x2="1140" y2="160" stroke="#94A3B8" stroke-width="2"/>
  <g>
    <circle cx="160" cy="160" r="6" fill="#2563EB"/>
    <rect x="70" y="56" width="180" height="78" rx="8" fill="#F8FAFC" stroke="#94A3B8"/>
    <text x="160" y="82" font-size="11" fill="#1F2937" text-anchor="middle">Monday 08:55 —</text>
    <text x="160" y="98" font-size="11" fill="#1F2937" text-anchor="middle">standup in five minutes</text>
    <rect x="70" y="190" width="180" height="58" rx="8" fill="#EAF2FB" stroke="#9CC0E6"/>
    <text x="160" y="212" font-size="10" fill="#1F2937" text-anchor="middle">Plant Bottleneck:</text>
    <text x="160" y="228" font-size="10" fill="#1F2937" text-anchor="middle">12 assets ranked</text>
  </g>
  <g>
    <circle cx="380" cy="160" r="6" fill="#2563EB"/>
    <rect x="290" y="56" width="180" height="78" rx="8" fill="#F8FAFC" stroke="#94A3B8"/>
    <text x="380" y="82" font-size="11" fill="#1F2937" text-anchor="middle">Top of the board:</text>
    <text x="380" y="98" font-size="11" fill="#1F2937" text-anchor="middle">GEARBOX-05, ⛔ flagged</text>
    <rect x="290" y="190" width="180" height="58" rx="8" fill="#EAF2FB" stroke="#9CC0E6"/>
    <text x="380" y="212" font-size="10" fill="#1F2937" text-anchor="middle">bands from config</text>
    <text x="380" y="228" font-size="10" fill="#1F2937" text-anchor="middle">never invented by UI</text>
  </g>
  <g>
    <circle cx="600" cy="160" r="8" fill="#B388FF"/>
    <rect x="504" y="48" width="192" height="90" rx="8" fill="#F3E8FF" stroke="#B388FF" stroke-width="2"/>
    <text x="600" y="76" font-size="11" font-weight="bold" fill="#1F2937" text-anchor="middle">She clicks one number</text>
    <text x="600" y="92" font-size="11" font-weight="bold" fill="#1F2937" text-anchor="middle">she doesn't believe</text>
    <text x="600" y="112" font-size="10" fill="#6B21A8" text-anchor="middle">evidence in two clicks</text>
    <rect x="504" y="190" width="192" height="58" rx="8" fill="#F3E8FF" stroke="#B388FF"/>
    <text x="600" y="212" font-size="10" fill="#1F2937" text-anchor="middle">Deep-Dive: sensors in σ,</text>
    <text x="600" y="228" font-size="10" fill="#1F2937" text-anchor="middle">SHAP, parts, SQL</text>
  </g>
  <g>
    <circle cx="820" cy="160" r="6" fill="#2563EB"/>
    <rect x="730" y="56" width="180" height="78" rx="8" fill="#F8FAFC" stroke="#94A3B8"/>
    <text x="820" y="82" font-size="11" fill="#1F2937" text-anchor="middle">🔜 What does it idle</text>
    <text x="820" y="98" font-size="11" fill="#1F2937" text-anchor="middle">downstream?</text>
    <rect x="730" y="190" width="180" height="58" rx="8" fill="#EAF2FB" stroke="#9CC0E6"/>
    <text x="820" y="212" font-size="10" fill="#1F2937" text-anchor="middle">cascade_tool → system</text>
    <text x="820" y="228" font-size="10" fill="#1F2937" text-anchor="middle">priority + topology graph</text>
  </g>
  <g>
    <circle cx="1040" cy="160" r="6" fill="#2563EB"/>
    <rect x="950" y="56" width="180" height="78" rx="8" fill="#F8FAFC" stroke="#94A3B8"/>
    <text x="1040" y="82" font-size="11" fill="#1F2937" text-anchor="middle">🔜 What if we defer 48h?</text>
    <text x="1040" y="98" font-size="11" fill="#1F2937" text-anchor="middle">KPI row for standup</text>
    <rect x="950" y="190" width="180" height="58" rx="8" fill="#EAF2FB" stroke="#9CC0E6"/>
    <text x="1040" y="212" font-size="10" fill="#1F2937" text-anchor="middle">scenario_tool ·</text>
    <text x="1040" y="228" font-size="10" fill="#1F2937" text-anchor="middle">kpi_summary</text>
  </g>
</svg>
