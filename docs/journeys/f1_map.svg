    <rect x="730" y="190" width="180" height="58" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-dasharray="6 3"/>
    <text x="820" y="212" font-size="10" fill="#1F2937" text-anchor="middle">identity + signoff gate</text>
    <text x="820" y="228" font-size="10" fill="#1F2937" text-anchor="middle">daily management board</text>
